<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koło Naukowe SPA i BLPSP</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dsrdp5vrr/image/upload/kn-spa-i-blsps/logo3.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'JetBrains Mono', monospace; 
            background-color: #F8FAFC; 
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px); 
            background-size: 25px 25px;
            color: #012A4F;
        }

        .blueprint-section {
            background-color: #012A4F;
            position: relative;
            overflow: hidden;
        }

        .blueprint-grid {
            position: absolute;
            inset: 0;
            opacity: 0.2;
            background-image: radial-gradient(#038DAE 0.5px, transparent 0.5px);
            background-size: 20px 20px;
        }

        .blueprint-lines {
            position: absolute;
            inset: 0;
            opacity: 0.1;
            background-image: linear-gradient(#038DAE 1px, transparent 1px), linear-gradient(90deg, #038DAE 1px, transparent 1px);
            background-size: 100px 100px;
        }

        .data-block { 
            background: white; 
            border: 1px solid #cbd5e1; 
            position: relative;
        }

        .data-block::before {
            content: ''; position: absolute; top: -1px; left: -1px; width: 10px; height: 10px;
            border-top: 2px solid #038DAE; border-left: 2px solid #038DAE;
        }
        .data-block::after {
            content: ''; position: absolute; bottom: -1px; right: -1px; width: 10px; height: 10px;
            border-bottom: 2px solid #038DAE; border-right: 2px solid #038DAE;
        }

        .header-accent { border-left: 4px solid #038DAE; padding-left: 1.5rem; }
        .status-blink { animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        
        #lightbox {
            display: none; position: fixed; inset: 0;
            background: rgba(1, 42, 79, 0.98); z-index: 1000;
        }
        .section-border { border-color: #cbd5e1 !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#038DAE] selection:text-white">

    <nav class="sticky top-0 z-50 bg-white border-b border-slate-200 px-6 py-2">

                </div>
                <div class="hidden lg:flex flex-col border-l border-slate-200 pl-6">
                    <div class="flex items-center gap-2">
                        <div class="w-1.5 h-1.5 bg-[#038DAE] rounded-sm status-blink"></div>
                        <span class="font-bold tracking-[0.2em] text-[10px] uppercase text-[#012A4F]">KN SPA I BLSPS // ACTIVE</span>
                    </div>
                </div>
            </a>

            <div class="flex items-center gap-4 md:gap-8 text-[11px] font-bold tracking-[0.2em]">
                <a href="index.html" 
                   onclick="if(window.history.length > 1) { window.history.back(); return false; }"
                   class="t-translate text-[#012A4F] hover:text-[#038DAE] transition uppercase"

                <button onclick="toggleLanguage()" class="flex items-center gap-2 px-3 py-2 border border-slate-200 hover:border-[#038DAE] transition-all bg-slate-50 group/lang">

    </nav>

    <header class="blueprint-section py-20 border-b border-[#038DAE]/50">

    </main>

    <section id="kontakt" class="blueprint-section py-24 px-6 border-t border-[#038DAE]/50">

        <div class="blueprint-lines"></div>
        <div class="max-w-7xl mx-auto relative z-10">
            <div class="flex flex-col md:flex-row justify-between items-center gap-12">

                        data-en="READY FOR <br> <span class='text-[#038DAE]'>DEPLOYMENT?</span>">
                        GOTOWY NA <br> <span class="text-[#038DAE]">WDROŻENIE?</span>
                    </h2>
                </div>
                <div class="relative group p-8 border border-[#038DAE]/30 bg-[#012A4F]/50 backdrop-blur-sm">
                    <div class="absolute -top-[1px] -left-[1px] w-6 h-6 border-t-2 border-l-2 border-[#038DAE]"></div>
                    <div class="absolute -bottom-[1px] -right-[1px] w-6 h-6 border-b-2 border-r-2 border-[#038DAE]"></div>
                    <a href="mailto:knspaiblsps@gmail.com" class="text-2xl font-bold text-white hover:text-[#038DAE] transition-colors font-mono tracking-tighter">

    <footer class="py-10 text-center text-[10px] text-slate-400 uppercase tracking-[0.5em] font-bold">
        &copy; KN SPA I BLSPS // 2026
    </footer>

    <script src="src/data.js"></script>
    <script src="src/language.js"></script> <script src="src/project.js"></script>  </body>
</html>
