<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koło Naukowe SPA i BLPSP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'JetBrains Mono', monospace; 
            background-color: #F8FAFC; 
            /* Twoje ulubione kropki w wersji jasnej */
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px); 
            background-size: 25px 25px;
            color: #012A4F;
        }

        /* Kontenery danych dopasowane do jasnego motywu */
        .data-block { 
            background: white; 
            border: 1px dashed #cbd5e1; 
        }

        /* Akcent błękitny zamiast pomarańczowego */
        .header-accent { 
            border-left: 4px solid #038DAE; 
            padding-left: 1.5rem; 
        }

        .status-blink { animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.98);
            z-index: 1000;
            cursor: zoom-out;
            backdrop-filter: blur(15px);
        }

        /* Dodatkowy styl dla obramowań sekcji */
        .section-border {
            border-color: #cbd5e1 !important;
            border-style: dashed !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#038DAE] selection:text-white">

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-dashed border-slate-200 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" 
                onclick="if(window.history.length > 1) { window.history.back(); return false; }"
                class="text-[#038DAE] font-bold text-xs uppercase tracking-widest hover:text-[#012A4F] transition">
                    [ ← RETURN ]
            </a>
            <div class="flex items-center gap-4 text-[10px] text-slate-400 uppercase tracking-widest font-bold">
                <div class="w-2 h-2 bg-[#038DAE] rounded-full status-blink"></div>
                VISUALIZER_MODE: <span class="text-[#038DAE]">ENABLED</span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-16 w-full flex-grow border-x section-border">
        <header id="project-header" class="mb-16"></header>

        <div class="grid lg:grid-cols-4 gap-12">
            
            <div class="lg:col-span-3 space-y-20">
                <section id="project-visuals" class="space-y-6">
                    <div class="header-accent">
                        <h2 class="text-xl font-bold uppercase tracking-tighter text-[#012A4F]">Visual_Output</h2>
                    </div>
                </section>

                <section id="documentation" class="space-y-8">
                    <div class="header-accent">
                        <h2 class="text-xl font-bold uppercase tracking-tighter text-[#012A4F]">Technical_Specs</h2>
                    </div>
                    <div id="project-description" class="data-block p-8 border-l-4 border-l-[#038DAE] leading-relaxed text-slate-600 shadow-sm">
                    </div>
                </section>
            </div>
            
            <aside class="lg:col-span-1 space-y-12">
                <section id="personnel" class="space-y-6">
                    <div class="header-accent">
                        <h2 class="text-lg font-bold uppercase tracking-tighter text-[#012A4F]">Personnel</h2>
                    </div>
                    <div id="project-team" class="space-y-2">
                    </div>
                </section>
            </aside>
        </div>
    </main>

    <div id="lightbox" class="fixed inset-0 z-[1000] hidden flex flex-col items-center justify-center p-4">
        <button onclick="closeLightbox()" class="absolute top-6 right-8 text-[#012A4F] hover:text-[#038DAE] transition text-[10px] font-bold tracking-tighter uppercase">
            [ close_x ]
        </button>
        <button onclick="changeImage(-1)" class="absolute left-4 md:left-10 text-[#012A4F]/20 hover:text-[#038DAE] transition text-4xl p-4">‹</button>
        <button onclick="changeImage(1)" class="absolute right-4 md:right-10 text-[#012A4F]/20 hover:text-[#038DAE] transition text-4xl p-4">›</button>
        <img id="lightbox-img" src="" class="max-w-full max-h-[85vh] object-contain border border-slate-200 shadow-2xl bg-white">
        <div id="lightbox-counter" class="absolute bottom-10 text-[10px] text-slate-400 font-bold tracking-[0.5em] uppercase"></div>
    </div>

    <footer class="py-12 border-t section-border bg-white/50 text-center text-[10px] text-slate-400 uppercase tracking-[0.5em]">
        KN_PROJECT_LOG_SYSTEM // VER_2.0.26
    </footer>

    <script src="src/data.js"></script>
    <script src="src/project.js"></script>
</body>
</html>
