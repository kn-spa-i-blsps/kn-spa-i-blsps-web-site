<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Członka | KN SPA i BLPSP</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dsrdp5vrr/image/upload/f_auto,q_auto/kn-spa-i-blsps/logo3.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* BAZA STRONY - Jasne tło z kropkami */
        body { 
            font-family: 'JetBrains Mono', monospace; 
            background-color: #F8FAFC; 
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px); 
            background-size: 25px 25px;
            color: #012A4F;
            margin: 0;
        }

        /* MODUŁ BLUEPRINT (KARTA) - Techniczne ciemne tło */
        .blueprint-card {
            background-color: #012A4F;
            /* Podwójna siatka linii: Główne (100px) i pomocnicze (20px) */
            background-image: 
                linear-gradient(rgba(3, 141, 174, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(3, 141, 174, 0.2) 1px, transparent 1px),
                linear-gradient(rgba(3, 141, 174, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(3, 141, 174, 0.1) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid #038DAE;
            box-shadow: 0 25px 50px -12px rgba(1, 42, 79, 0.6);
        }

        /* Efekt winiety dla głębi tła blueprint */
        .blueprint-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(1, 42, 79, 0.4) 100%);
            pointer-events: none;
        }

        /* Narożniki techniczne */
        .blueprint-card::before {
            content: ''; position: absolute; top: -1px; left: -1px; width: 40px; height: 40px;
            border-top: 4px solid #038DAE; border-left: 4px solid #038DAE; z-index: 20;
        }
        .blueprint-card::after {
            content: ''; position: absolute; bottom: -1px; right: -1px; width: 40px; height: 40px;
            border-bottom: 4px solid #038DAE; border-right: 4px solid #038DAE; z-index: 20;
        }

        /* BIAŁE OKNO BIO - Kontrastowy moduł */
        .bio-window {
            background: white;
            border: 1px solid #cbd5e1;
            position: relative;
            color: #475569;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            z-index: 5;
        }

        .bio-window::before {
            content: 'DATA_STREAM_v2.0';
            position: absolute;
            top: -10px;
            left: 20px;
            background: #038DAE;
            color: white;
            font-size: 8px;
            padding: 2px 10px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* KONTENER ZDJĘCIA */
        .img-container {
            border: 1px solid #038DAE;
            background: #012A4F;
            position: relative;
            padding: 5px;
        }

        .img-content {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: block;
        }

        .blueprint-card:hover .img-content {
            transform: scale(1.03);
        }

        /* STYLE DLA MARKDOWN (Wewnątrz białego okna) */
        .markdown-body h3 {
            color: #012A4F;
            font-size: 0.875rem;
            font-weight: 800;
            text-transform: uppercase;
            margin: 1.5rem 0 0.5rem 0;
            display: flex;
            align-items: center;
        }
        .markdown-body h3::before { content: ">"; margin-right: 8px; color: #038DAE; }
        .markdown-body p { margin-bottom: 1.25rem; text-align: justify; line-height: 1.7; font-size: 0.95rem; }
        .markdown-body strong { color: #012A4F; font-weight: 700; }
        .markdown-body ul { margin-bottom: 1.25rem; }
        .markdown-body li { position: relative; padding-left: 1.25rem; margin-bottom: 0.5rem; }
        .markdown-body li::before { content: "■"; position: absolute; left: 0; color: #038DAE; font-size: 8px; top: 6px; }

        /* ANIMACJE I STATUS */
        .status-blink { 
            animation: blink 1.5s infinite; 
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }
        
        @keyframes blink { 
            0% { opacity: 1; } 
            50% { opacity: 0.3; } 
            100% { opacity: 1; } 
        }

        /* Nawigacja powrotna */
        nav a {
            position: relative;
            display: inline-block;
        }
        nav a::after {
            content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 1px;
            background: #038DAE; transition: width 0.3s;
        }
        nav a:hover::after { width: 100%; }
        /* Usuwa pasek pod logo, zostawia pod RETURN_TO_BASE */
        nav a.logo-link::after {
            display: none !important;
}
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#038DAE] selection:text-white">

    <nav class="sticky top-0 z-50 bg-white border-b border-slate-200 px-6 py-2">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-6 group">
                <div class="h-12 w-auto"> 
                    <img src="https://res.cloudinary.com/dsrdp5vrr/image/upload/f_auto,q_auto/kn-spa-i-blsps/logo3.png" alt="Logo" class="h-full w-auto object-contain transition-transform group-hover:scale-105">
                </div>
                <div class="hidden lg:flex flex-col border-l border-slate-200 pl-6">
                    <div class="flex items-center gap-2">
                        <div class="w-1.5 h-1.5 bg-[#038DAE] rounded-sm status-blink"></div>
                        <span class="font-bold tracking-[0.2em] text-[10px] uppercase text-[#012A4F]">KN SPA I BLSPS // ACTIVE</span>
                    </div>
                </div>
            </a>

            <div class="flex items-center gap-4 md:gap-8 text-[11px] font-bold tracking-[0.2em]">
                <div class="hidden md:flex items-center gap-8">
                    <a href="projects.html" class="t-translate text-[#012A4F] hover:text-[#038DAE] transition uppercase" data-pl="PROJEKTY" data-en="PROJECTS">PROJEKTY</a>
                    <a href="team.html" class="t-translate text-[#012A4F] hover:text-[#038DAE] transition uppercase" data-pl="ZESPÓŁ" data-en="TEAM">ZESPÓŁ</a>
                </div>

                <a href="contact.html" class="t-translate border border-[#038DAE] text-[#038DAE] px-5 py-2 hover:bg-[#038DAE] hover:text-white transition duration-300 font-bold uppercase" data-pl="KONTAKT" data-en="CONTACT">
                    KONTAKT
                </a>

                <button onclick="toggleLanguage()" class="flex items-center gap-2 px-3 py-2 border border-slate-200 hover:border-[#038DAE] transition-all bg-slate-50 group/lang">
                    <span id="lang-flag" class="text-base leading-none group-hover/lang:scale-110 transition-transform">🇵🇱</span>
                    <span id="lang-label" class="text-[9px] text-slate-400 group-hover/lang:text-[#038DAE]">PL</span>
                </button>
            </div>
        </div>
    </nav>

    <main id="profile-content" class="flex-grow flex items-center justify-center px-4 py-12 w-full">
        </main>

    <footer class="p-6 text-center text-[10px] text-slate-400 uppercase tracking-[0.3em] font-bold">
        KN_UNIT_PROFILE_SYSTEM // VER 2.0.26
    </footer>

    <script src="src/data.js"></script>
    <script src="src/member.js"></script>
    <script src="src/language.js"></script>
</body>
</html>
