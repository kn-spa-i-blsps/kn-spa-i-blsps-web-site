<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koło Naukowe SPA i BLPSP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { 
            font-family: 'JetBrains Mono', monospace; 
            background-color: #0a0a0b;
            background-image: radial-gradient(#1a1a1c 1px, transparent 1px);
            background-size: 30px 30px;
            color: #ececec;
        }

        /* Naprawiona karta */
        .profile-card {
            background: rgba(15, 15, 18, 0.95);
            border: 1px solid #27272a;
            position: relative;
            /* Usunięto wszystko, co mogłoby ucinać napisy */
        }

        /* Etykieta w rogu - teraz bezpiecznie przypięta */
        .card-label {
            position: absolute;
            top: -12px;
            right: 20px;
            background: #f97316;
            color: black;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 10px;
            z-index: 50;
            letter-spacing: 1px;
        }

        /* Naprawiony efekt grayscale */
        .img-container {
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
        }

        .img-content {
            filter: grayscale(100%);
            opacity: 0.7;
            transition: all 0.5s ease;
        }

        /* Hover efekty */
        .group:hover .img-container {
            border-color: #f97316;
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.15);
        }

        .group:hover .img-content {
            filter: grayscale(0%);
            opacity: 1;
            transform: scale(1.03);
        }

        /* Style dla treści Markdown */
        .markdown-body {
            color: #9ca3af; /* szary tekst */
        }

        .markdown-body h3 {
            color: #f97316; /* pomarańczowe nagłówki */
            font-size: 0.875rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
        }

        /* Opcjonalny bajer: kreska przed nagłówkiem MD */
        .markdown-body h3::before {
            content: ">";
            margin-right: 8px;
            opacity: 0.5;
        }

        .markdown-body p {
            margin-bottom: 1.25rem;
            text-align: justify;
        }

        .markdown-body ul {
            list-style-type: none; /* usuwamy standardowe kropki */
            padding-left: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .markdown-body li {
            margin-bottom: 0.5rem;
            position: relative;
            padding-left: 1.5rem;
        }

        /* Własne kropki listy w stylu retro-terminala */
        .markdown-body li::before {
            content: "■";
            position: absolute;
            left: 0;
            color: #f97316;
            font-size: 8px;
            top: 6px;
        }

        .markdown-body strong {
            color: #ffffff;
            font-weight: 700;
        }

        .markdown-body hr {
            border: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin: 2rem 0;
        }

        .markdown-body blockquote {
            border-left: 2px solid #f97316;
            padding: 0.5rem 0 0.5rem 1.5rem;
            margin: 1.5rem 0;
            background: rgba(249, 115, 22, 0.03);
            font-style: italic;
        }

        .markdown-body a {
            color: #f97316;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: all 0.3s;
        }

        .markdown-body a:hover {
            border-bottom: 1px solid #f97316;
        }

        .status-blink { animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="p-6">
        <a href="index.html" 
            onclick="if(window.history.length > 1) { window.history.back(); return false; }"
            class="text-orange-500 font-bold text-xs uppercase tracking-widest hover:text-white transition">
                [ ← RETURN ]
        </a>
    </nav>

    <main id="profile-content" class="flex-grow flex items-center justify-center px-4 py-12">
        </main>

    <footer class="p-6 text-center text-[10px] text-gray-600 uppercase tracking-[0.3em]">
        KN_UNIT_PROFILE_SYSTEM // VER 2.0.26
    </footer>

    <script src="src/data.js"></script>
    <script src="src/member.js"></script>
</body>
</html>
