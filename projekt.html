<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT_FILE // KN_RESEARCH_LAB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'JetBrains Mono', monospace; 
            background-color: #0a0a0b;
            background-image: radial-gradient(#1a1a1c 1px, transparent 1px);
            background-size: 30px 30px;
            color: #ececec;
        }
        .data-block { background: rgba(15, 15, 18, 0.8); border: 1px solid #27272a; }
        .header-accent { border-left: 4px solid #f97316; padding-left: 1.5rem; }
        .status-blink { animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        
        /* Styl modala (Lightbox) */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            cursor: zoom-out;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-orange-500 selection:text-black">

    <nav class="sticky top-0 z-50 bg-[#0a0a0b]/80 backdrop-blur-md border-b border-white/5 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html#projekty" class="text-orange-500 font-bold text-xs uppercase tracking-[0.2em] hover:text-white transition group">
                [ ← BACK_TO_DASHBOARD ]
            </a>
            <div class="flex items-center gap-4 text-[10px] text-gray-600 uppercase tracking-widest">
                <div class="w-2 h-2 bg-orange-500 rounded-full status-blink"></div>
                VISUALIZER_MODE: <span class="text-orange-500/80">ENABLED</span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-16 w-full flex-grow">
        <header id="project-header" class="mb-16"></header>

        <div class="grid lg:grid-cols-3 gap-16">
            <div class="lg:col-span-2 space-y-20">
                <section id="project-visuals" class="space-y-6">
                    <div class="header-accent">
                        <h2 class="text-xl font-bold uppercase tracking-tighter text-white">Visual_Output</h2>
                    </div>
                </section>

                <section id="documentation" class="space-y-8">
                    <div class="header-accent">
                        <h2 class="text-xl font-bold uppercase tracking-tighter text-white">Technical_Specs</h2>
                    </div>
                    <div id="project-description" class="data-block p-8 border-l-4 border-l-orange-500"></div>
                </section>
            </div>
            
            <aside class="space-y-12">
                <section id="personnel" class="space-y-8">
                    <div class="header-accent">
                        <h2 class="text-lg font-bold uppercase tracking-tighter text-white">Personnel_Assigned</h2>
                    </div>
                    <div id="project-team" class="space-y-3"></div>
                </section>
            </aside>
        </div>
    </main>

    <div id="lightbox" class="fixed inset-0 bg-black/95 z-[1000] hidden flex-col items-center justify-center p-4 backdrop-blur-xl">
        <button onclick="closeLightbox()" class="absolute top-6 right-8 text-gray-500 hover:text-orange-500 transition text-2xl font-bold tracking-tighter uppercase text-[10px]">
            [ close_x ]
        </button>
        
        <button onclick="changeImage(-1)" class="absolute left-4 md:left-10 text-white/20 hover:text-orange-500 transition text-4xl p-4">‹</button>
        <button onclick="changeImage(1)" class="absolute right-4 md:right-10 text-white/20 hover:text-orange-500 transition text-4xl p-4">›</button>

        <img id="lightbox-img" src="" class="max-w-full max-h-[85vh] object-contain border border-white/5 shadow-2xl transition-all duration-300">
        
        <div id="lightbox-counter" class="absolute bottom-10 text-[10px] text-gray-600 font-bold tracking-[0.5em] uppercase"></div>
    </div>

    <footer class="py-12 border-t border-white/5 bg-[#0e0e10]/50 text-center text-[10px] text-gray-600 uppercase tracking-[0.5em]">
        KN_PROJECT_LOG_SYSTEM // VER_2.0.26
    </footer>

    <script src="data.js"></script>
    <script src="project-detail.js"></script>
</body>
</html>
