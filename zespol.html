<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERSONNEL_DATABASE // KN_RESEARCH_LAB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'JetBrains Mono', monospace; 
            background-color: #0a0a0b;
            background-image: radial-gradient(#1a1a1c 1px, transparent 1px);
            background-size: 30px 30px;
            color: #ececec;
        }
        .header-line {
            height: 1px;
            background: linear-gradient(90deg, #f97316 0%, transparent 100%);
        }
        /* Styl paska przewijania dla całej strony */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #f97316; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="p-6 border-b border-white/5 bg-[#0a0a0b]/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-orange-500 font-bold text-xs uppercase tracking-widest hover:text-white transition">
                [ ← RETURN_TO_DASHBOARD ]
            </a>
            <div class="text-[10px] text-gray-500 hidden md:block uppercase tracking-widest">
                System: Active // Personnel_Count: <span id="member-count">--</span>
            </div>
        </div>
    </nav>

    <header class="py-16 max-w-7xl mx-auto px-6 w-full">
        <div class="inline-block border-l-4 border-orange-500 pl-6">
            <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tighter text-white mb-2">Personnel</h1>
            <p class="text-orange-500 font-bold text-xs uppercase tracking-[0.4em]">Lista aktywnych jednostek</p>
        </div>
        <div class="header-line mt-8 opacity-30"></div>
    </header>

    <main class="flex-grow py-12 max-w-7xl mx-auto px-6 w-full">
        <div id="team-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-px bg-white/5 border border-white/5">
            </div>
    </main>

    <footer class="py-12 border-t border-white/5 text-center">
        <div class="text-[10px] text-gray-600 uppercase tracking-[0.5em]">
            KN_CORE_DATABASE_SUBSYSTEM // 2026
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="team.js"></script>

</body>
</html>
