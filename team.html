<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KN SPA i BLPSP - Zespół</title>
    <link rel="icon" type="image/png" href="gallery/logo3.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'JetBrains Mono', monospace; 
            background-color: #F8FAFC; 
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px); 
            background-size: 25px 25px;
            color: #012A4F;
        }

        /* BLUEPRINT CARD */
        .blueprint-card {
            background-color: #012A4F;
            background-image: 
                linear-gradient(rgba(3, 141, 174, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(3, 141, 174, 0.2) 1px, transparent 1px),
                linear-gradient(rgba(3, 141, 174, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(3, 141, 174, 0.1) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid #038DAE;
            box-shadow: 0 25px 50px -12px rgba(1, 42, 79, 0.6);
            transition: transform 0.2s ease, border-color 0.2s ease;
            will-change: transform;
        }

        .blueprint-card:hover {
            transform: translateY(-4px);
            border-color: #4ade80;
        }

        .blueprint-card::before {
            content: ''; position: absolute; top: -1px; left: -1px; width: 10px; height: 10px;
            border-top: 2px solid #038DAE; border-left: 2px solid #038DAE;
        }

        .img-blueprint-wrap {
            border: 1px solid #038DAE;
            background: #012A4F;
            overflow: hidden;
        }

        .status-blink { 
            background-color: #4ade80;
            box-shadow: 0 0 5px rgba(74, 222, 128, 0.5);
            will-change: opacity, transform;
            animation: pulse-simple 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; 
        }

        @keyframes pulse-simple {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.9); }
        }

        .status-glow { filter: blur(1px); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #038DAE; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#038DAE] selection:text-white">

    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-dashed border-slate-200 px-6 py-2">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            
            <a href="index.html" class="flex items-center gap-6 group">
                <div class="h-12 w-auto flex items-center"> 
                    <img src="gallery/logo3.png" alt="Logo" class="h-full w-auto object-contain transition-transform group-hover:scale-105">
                </div>
                <div class="hidden lg:flex flex-col border-l border-slate-200 pl-6">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-[#038DAE] rounded-sm status-blink shadow-[0_0_8px_#038DAE]"></div>
                        <span class="font-bold tracking-[0.2em] text-[10px] uppercase text-[#012A4F]">KN SPA I BLSPS // ACTIVE</span>
                    </div>
                </div>
            </a>

            <div class="flex items-center gap-6">
                
                <div class="hidden sm:block text-[10px] text-slate-400 uppercase tracking-widest font-bold border-r border-slate-200 pr-6">
                    <span class="t-translate" data-pl="JEDNOSTKI" data-en="UNITS_DEPLOYED">JEDNOSTKI</span>: <span id="member-count" class="text-[#038DAE]">--</span>
                </div>
                
                <a href="index.html" 
                   onclick="if(window.history.length > 1) { window.history.back(); return false; }"
                   class="t-translate text-[#038DAE] font-bold text-[11px] uppercase tracking-widest hover:text-[#012A4F] transition-all"
                   data-pl="[ ← POWRÓT ]"
                   data-en="[ ← BACK ]">
                    [ ← POWRÓT ]
                </a>

                <button onclick="toggleLanguage()" class="flex items-center gap-2 px-2 py-1.5 border border-slate-200 hover:border-[#038DAE] transition-all bg-white/50 group/lang">
                    <span id="lang-flag" class="text-sm leading-none group-hover/lang:scale-110 transition-transform">🇵🇱</span>
                    <span id="lang-label" class="text-[9px] text-slate-400 group-hover/lang:text-[#038DAE]">PL</span>
                </button>
            </div>
        </div>
    </nav>

    <header class="py-16 max-w-7xl mx-auto px-6 w-full">
        <div class="border-l-4 border-[#038DAE] pl-6">
            <h1 class="t-translate text-5xl md:text-7xl font-black uppercase tracking-tighter text-[#012A4F] italic"
                data-pl="ZESPÓŁ" data-en="TEAM">
                ZESPÓŁ
            </h1>
            <p class="text-[#038DAE] font-bold text-[10px] uppercase tracking-[0.5em]">Active_Duty_Roster_2026</p>
        </div>
    </header>

    <main class="flex-grow py-8 max-w-7xl mx-auto px-6 w-full">
        <div id="team-container" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
            </div>
    </main>

    <footer class="py-12 text-center opacity-50">
        <div class="text-[9px] uppercase tracking-[0.5em] font-bold">KN_UNIT_SYSTEM_v2.0</div>
    </footer>

    <script src="src/data.js"></script>
    <script src="src/language.js"></script>
    <script src="src/team.js"></script>
</body>
</html>
