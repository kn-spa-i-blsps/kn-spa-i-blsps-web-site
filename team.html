<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koło Naukowe SPA i BLPSP - Zespół</title>
    <link rel="icon" type="image/png" href="gallery/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'JetBrains Mono', monospace; 
            background-color: #F8FAFC; 
            /* Techniczna siatka kropek */
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px); 
            background-size: 25px 25px;
            color: #012A4F;
        }

        .header-line {
            height: 1px;
            background: linear-gradient(90deg, #038DAE 0%, transparent 100%);
        }

        /* Styl paska przewijania w kolorach błękitu */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #F8FAFC; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #038DAE; }

        /* Klasa dla siatki - teraz linie są przerywane i jasne */
        #team-container {
            background-color: transparent;
            border-color: #cbd5e1;
            border-style: dashed;
        }

        .member-tile {
            background: white;
            border: 1px dashed #cbd5e1;
            transition: all 0.3s ease;
        }

        .member-tile:hover {
            border-color: #038DAE;
            z-index: 10;
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(1, 42, 79, 0.05);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#038DAE] selection:text-white">

    <nav class="p-6 border-b border-dashed border-slate-200 bg-white/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" 
                onclick="if(window.history.length > 1) { window.history.back(); return false; }"
                class="text-[#038DAE] font-bold text-xs uppercase tracking-widest hover:text-[#012A4F] transition">
                    [ ← RETURN ]
            </a>
            <div class="text-[10px] text-slate-400 hidden md:block uppercase tracking-widest font-bold">
                System: Active // Units_Deployed: <span id="member-count" class="text-[#038DAE]">--</span>
            </div>
        </div>
    </nav>

    <header class="py-16 max-w-7xl mx-auto px-6 w-full">
        <div class="inline-block border-l-4 border-[#038DAE] pl-6">
            <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tighter text-[#012A4F] mb-2">Zespół</h1>
            <p class="text-[#038DAE] font-bold text-xs uppercase tracking-[0.4em]">Lista aktywnych jednostek</p>
        </div>
        <div class="header-line mt-8 opacity-50"></div>
    </header>

    <main class="flex-grow py-12 max-w-7xl mx-auto px-6 w-full">
        <div id="team-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            </div>
    </main>

    <footer class="py-12 border-t border-dashed border-slate-200 text-center bg-white/50">
        <div class="text-[10px] text-slate-400 uppercase tracking-[0.5em] font-bold">
            KN_SPA_I_BLSPS // TERMINAL_V_2.0.26
        </div>
    </footer>

    <script src="src/data.js"></script>
    <script src="src/team.js"></script>

</body>
</html>
