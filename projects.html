<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekty | KN SPA i BLSPS</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dsrdp5vrr/image/upload/f_auto,q_auto/kn-spa-i-blsps/logo3.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/subpages.css?v=3">
    <style>
        body { 
            font-family: 'JetBrains Mono', monospace; 
            background-color: #F8FAFC; 
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px); 
            background-size: 25px 25px;
            color: #012A4F;
        }

        .tech-card {
            background: white;
            border: 1px solid #cbd5e1;
            transition: all 0.3s ease;
        }
        
        .tech-card:hover {
            border-color: #038DAE;
            box-shadow: 0 10px 30px rgba(1, 42, 79, 0.05);
            transform: translateY(-2px);
        }

        .status-blink { animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .blueprint-header {
            background-color: #012A4F;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(3, 141, 174, 0.5);
        }
    </style>
</head>
<body class="selection:bg-[#038DAE] selection:text-white flex flex-col min-h-screen">

    <nav class="sticky top-0 z-50 bg-white border-b border-slate-200 px-6 py-2">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-6 group">
                <div class="h-12 w-auto"> 
                    <img src="https://res.cloudinary.com/dsrdp5vrr/image/upload/f_auto,q_auto/kn-spa-i-blsps/logo3.png" alt="Logo" class="h-full w-auto object-contain transition-transform group-hover:scale-105">
                </div>
                <div class="hidden lg:flex flex-col border-l border-slate-200 pl-6">
                    <div class="flex items-center gap-2">
                        <div class="w-1.5 h-1.5 bg-[#038DAE] rounded-sm status-blink"></div>
                        <span class="font-bold tracking-[0.2em] text-[10px] uppercase text-[#012A4F]">KN SPA I BLSPS // REPOSITORY</span>
                    </div>
                </div>
            </a>

            <div class="flex items-center gap-4 md:gap-8 text-[11px] font-bold tracking-[0.2em]">
                <div class="hidden md:flex items-center gap-8">
                    <a href="index.html" class="t-translate text-[#012A4F] hover:text-[#038DAE] transition uppercase" data-pl="GŁÓWNA" data-en="HOME">GŁÓWNA</a>
                    <a href="team.html" class="t-translate text-[#012A4F] hover:text-[#038DAE] transition uppercase" data-pl="ZESPÓŁ" data-en="TEAM">ZESPÓŁ</a>
                </div>

                <a href="contact.html" class="t-translate border border-[#038DAE] text-[#038DAE] px-5 py-2 hover:bg-[#038DAE] hover:text-white transition duration-300 font-bold uppercase" data-pl="KONTAKT" data-en="CONTACT">
                    KONTAKT
                </a>

                <button onclick="toggleLanguage()" class="flex items-center gap-2 px-3 py-2 border border-slate-200 hover:border-[#038DAE] transition-all bg-slate-50 group/lang">
                    <span id="lang-flag" class="text-base leading-none group-hover/lang:scale-110 transition-transform">🇵🇱</span>
                    <span id="lang-label" class="text-[9px] text-slate-400 group-hover/lang:text-[#038DAE]">PL</span>
                </button>
            </div>
        </div>
    </nav>

    <header class="sp-hero py-20">
        <div class="sp-hero-inner max-w-7xl mx-auto px-6">
            <span class="sp-badge">Archive_Access_Protocol</span>
            <h1 class="text-5xl md:text-7xl font-black tracking-tighter text-white uppercase italic leading-none">
                <span class="t-translate" data-pl="PEŁNA" data-en="FULL">PEŁNA</span><br>
                <span class="text-[#038DAE] t-translate" data-pl="DOKUMENTACJA" data-en="DOCUMENTATION">DOKUMENTACJA</span>
            </h1>
            <p class="t-translate mt-6 text-slate-400 max-w-xl text-sm leading-relaxed font-light uppercase tracking-wide"
               data-pl="Przegląd wszystkich jednostek badawczych, systemów pomiarowych oraz projektów realizowanych w ramach KN SPA i BLSPS."
               data-en="Overview of all research units, measurement systems, and projects carried out within KN SPA and BLSPS.">
                Przegląd wszystkich jednostek badawczych, systemów pomiarowych oraz projektów realizowanych w ramach KN SPA i BLSPS.
            </p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-16 w-full flex-grow">
        <div class="sp-divider"><span>Data_Output</span></div>
        <div id="projects-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <footer class="py-10 text-center text-[10px] text-slate-400 uppercase tracking-[0.5em] font-bold border-t border-slate-200 bg-white">
        &copy; KN SPA I BLSPS // 2026
    </footer>

    <script>
      window.__pageScripts = ['/src/home.js'];
      window.__afterLoad = function () {
        const container = document.getElementById('projects-container');
        if (!container) return;
        container.innerHTML = projects.map((proj, index) => {
          const href = proj.id === 'bluespark' ? '/bluespark/' : `project.html?id=${proj.id}`;
          const img = `https://res.cloudinary.com/dsrdp5vrr/image/upload/f_auto,q_auto,w_900,c_limit/kn-spa-i-blsps/projects/${proj.id}/main.jpg`;
          return `<a href="${href}" class="sp-panel sp-project-card overflow-hidden group">
            <div class="img-wrap"><img src="${img}" alt="" loading="lazy" onerror="handleHomeProjectImageError(this,'${proj.id}','${proj.image || ''}')"></div>
            <div class="p-5 flex flex-col flex-grow">
              <span class="text-[9px] font-bold text-[#038DAE] tracking-widest uppercase mb-2">SYS_0${index + 1} // ${proj.id}</span>
              <h3 class="text-lg font-bold text-[#012A4F] uppercase mb-2 group-hover:text-[#038DAE] transition">${t(proj.title)}</h3>
              <p class="text-[11px] text-slate-500 leading-relaxed flex-grow">${t(proj.shortDesc)}</p>
              <span class="text-[10px] font-bold text-[#038DAE]/70 mt-4 uppercase tracking-tighter">DECRYPT_DATA >></span>
            </div>
          </a>`;
        }).join('');
      };
    </script>
    <script src="/src/language.js"></script>
    <script src="/src/loader.js"></script>
</body>
</html>
